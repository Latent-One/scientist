[package]
name = "scientist"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A local, reproducible instrument for materials and superconductor investigations: LLM planner + ML models + event-sourced Rust runtime"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = "1.1.7"
ureq = { version = "2", features = ["json"] }
