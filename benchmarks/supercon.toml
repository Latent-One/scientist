[baseline]               # measured on this machine 2026-10-08
alignn_yes_no = 12        # correct "is it a superconductor" calls at 1 K, out of 12
betenet_yes_no = 11
alignn_mae_k = 2.4        # mean |predicted - measured|, blind spots excluded
betenet_mae_k = 4.5
verdicts_consistent = 12  # superconductors not labelled "unlikely", non-superconductors labelled "unlikely"
