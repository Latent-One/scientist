# Superconductivity benchmark: materials with MEASURED Tc, used to check the Tc models after any change.
# Tc values: 3DSC (SuperCon) entries closest to the pure compound, retrieved 2026-10-08.
# Structures: Materials Project ids, except where the lowest-energy MP phase is NOT the superconducting
# polymorph (Ta, NbN) or not the ordinary phase (Ag): those are built from standard prototypes.
# Training overlap (checked 2026-10-08 with pymatgen StructureMatcher against each model's dataset and split):
# seen_* = "train" means the model was trained on this exact crystal, so its score there measures memory, not prediction.
# Run: scientist benchmark

[[material]]
name = "MgB2"
seen_alignn = "test (DFT 8.5 K)"
seen_betenet = "train"
mp_id = "mp-763"
tc_measured_k = 37.80
blind_spot = true      # two-gap superconductor: all tested models predict 1-7 K

[[material]]
name = "V3Si"
seen_alignn = "no"
seen_betenet = "no"
mp_id = "mp-2567"
tc_measured_k = 16.48

[[material]]
name = "Nb3Sn"
seen_alignn = "train (DFT 15.3 K)"
seen_betenet = "no"
mp_id = "mp-1326"
tc_measured_k = 16.71

[[material]]
name = "NbN"
seen_alignn = "no"
seen_betenet = "no"
prototype = "rocksalt"   # cubic delta-NbN; MP's lowest phase (hexagonal mp-2634) is not the 17 K superconductor
formula = "NbN"
a = 4.39
tc_measured_k = 17.30

[[material]]
name = "NbC"
seen_alignn = "train (DFT 13.7 K)"
seen_betenet = "train"
mp_id = "mp-910"
