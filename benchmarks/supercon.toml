seen_betenet = "train"
mp_id = "mp-75"
tc_measured_k = 9.00

[[material]]
name = "Pb"
seen_alignn = "unknown: in dataset, not in split (DFT 5.5 K)"
seen_betenet = "train"
mp_id = "mp-20483"
